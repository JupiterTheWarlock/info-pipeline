<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>InfoPipeline</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%230A0908'/%3E%3Cpath d='M14 18h34M14 32h24M14 46h34' stroke='%23DA7756' stroke-width='6' stroke-linecap='round'/%3E%3Ccircle cx='50' cy='32' r='5' fill='%23E8985C'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="app" id="appShell" data-mode="list">
    <aside class="sidebar">
      <div class="panelHeader">
        <div class="brand">
          <div class="brandTitle">InfoPipeline</div>
          <div class="brandSub">personal signal browser</div>
        </div>
        <button class="iconBtn" id="refreshAll" title="刷新" aria-label="刷新">↻</button>
      </div>
      <div class="mobileModeTabs" aria-label="视图切换">
        <button class="modeBtn selected" type="button" data-mode="list">列表</button>
        <button class="modeBtn" type="button" data-mode="detail">详情</button>
      </div>
      <div class="sidebarScroll scroll">
        <div class="sectionLabel">Dates</div>
        <div id="tree" class="tree"><div class="loading">Loading dates...</div></div>
        <div class="sectionLabel">Sources</div>
        <div id="sources" class="sourceList"></div>
      </div>
    </aside>

    <main class="main">
      <div class="toolbar">
        <div class="toolbarCopy">
          <div class="toolbarTitle" id="viewTitle">Items / all dates</div>
          <div class="toolbarMeta" id="viewMeta">等待数据加载</div>
        </div>
        <div class="actions">
          <button class="textBtn" id="collectBtn" type="button">Collect</button>
          <button class="textBtn" id="analyzeBtn" type="button">Analyze</button>
          <button class="textBtn" id="reportBtn" type="button">Report</button>
          <button class="textBtn subtle" id="clearBtn" type="button">Clear</button>
        </div>
      </div>

      <div class="filterStrip">
        <label class="searchBox">
          <span class="filterKicker">Search</span>
          <input id="searchInput" type="search" placeholder="标题、摘要、标签、作者..." autocomplete="off">
        </label>
        <div class="filterMenu" data-filter="source"></div>
        <div class="filterMenu" data-filter="category"></div>
        <div class="filterMenu" data-filter="minScore"></div>
      </div>

      <div class="listMeta">
        <span id="resultMeta">0 items</span>
        <div class="pager">
          <button class="textBtn subtle" id="prevPage" type="button">Prev</button>
          <button class="textBtn subtle" id="nextPage" type="button">Next</button>
        </div>
      </div>
      <div id="items" class="itemList scroll"></div>
    </main>

    <section class="detail">
      <div class="panelHeader">
        <div class="brand">
          <div class="brandTitle" id="detailHeader">Detail</div>
          <div class="brandSub" id="detailSub">选择一条信息或打开报告</div>
        </div>
        <div class="detailActions">
          <button class="textBtn subtle backBtn" id="backToList" type="button">List</button>
          <button class="textBtn" id="openBtn" type="button" disabled>Open</button>
        </div>
      </div>
      <div id="detailBody" class="detailBody scroll">
        <div class="empty">选择条目后查看摘要、偏好评分、风险和原始链接。</div>
      </div>
    </section>
  </div>

  <script src="/app.js"></script>
</body>
</html>
