<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>InfoPipeline 📡</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #1a1a2e; color: #e0e0e0; height: 100vh; display: flex;
  }

  /* Sidebar */
  #sidebar {
    width: 280px; min-width: 280px; background: #16213e;
    border-right: 1px solid #0f3460; display: flex; flex-direction: column;
    overflow: hidden;
  }
  #sidebar-header {
    padding: 20px; border-bottom: 1px solid #0f3460;
    font-size: 18px; font-weight: 600; color: #e94560;
  }
  #sidebar-header span { font-size: 12px; color: #666; margin-left: 8px; }
  #tree-container {
    flex: 1; overflow-y: auto; padding: 8px 0;
  }
  #tree-container::-webkit-scrollbar { width: 6px; }
  #tree-container::-webkit-scrollbar-thumb { background: #0f3460; border-radius: 3px; }

  .tree-year, .tree-month, .tree-day {
    display: flex; align-items: center; padding: 6px 16px; cursor: pointer;
    transition: background 0.15s; user-select: none;
  }
  .tree-year:hover, .tree-month:hover, .tree-day:hover { background: #0f3460; }
  .tree-day.active { background: #e94560; color: white; border-radius: 0; }
  .tree-arrow {
    display: inline-block; width: 16px; text-align: center;
    transition: transform 0.2s; margin-right: 4px; font-size: 12px;
  }
  .tree-arrow.expanded { transform: rotate(90deg); }
  .tree-children { display: none; }
  .tree-children.open { display: block; }
  .tree-label { margin-left: 4px; }
  .tree-count {
    margin-left: auto; font-size: 11px; color: #666;
    background: #0f3460; padding: 1px 6px; border-radius: 10px;
  }
  .tree-day .tree-count { background: rgba(233,69,96,0.3); color: #e94560; }
  .tree-day.active .tree-count { background: rgba(255,255,255,0.2); color: white; }

  /* Main content */
  #main {
    flex: 1; display: flex; flex-direction: column; overflow: hidden;
  }
  #main-header {
    padding: 20px 30px; border-bottom: 1px solid #0f3460;
    display: flex; align-items: center; justify-content: space-between;
  }
  #main-header h1 { font-size: 22px; font-weight: 600; }
  #stats {
    font-size: 13px; color: #888; display: flex; gap: 20px;
  }
  #content-wrapper {
    flex: 1; overflow-y: auto; padding: 30px;
  }
  #content-wrapper::-webkit-scrollbar { width: 8px; }
  #content-wrapper::-webkit-scrollbar-thumb { background: #0f3460; border-radius: 4px; }

  /* Markdown rendering */
  .markdown { max-width: 800px; line-height: 1.7; }
  .markdown h1 { font-size: 24px; margin: 0 0 16px; color: #e94560; }
  .markdown h2 { font-size: 18px; margin: 24px 0 12px; color: #53a8b6; border-bottom: 1px solid #0f3460; padding-bottom: 6px; }
  .markdown h3 { font-size: 15px; margin: 16px 0 8px; color: #888; }
  .markdown blockquote { border-left: 3px solid #e94560; padding: 8px 16px; margin: 12px 0; background: #16213e; border-radius: 0 6px 6px 0; }
  .markdown ul { padding-left: 20px; }
  .markdown li { margin: 6px 0; }
  .markdown a { color: #e94560; text-decoration: none; }
  .markdown a:hover { text-decoration: underline; }
  .markdown code { background: #0f3460; padding: 2px 6px; border-radius: 3px; font-size: 0.9em; }
  .markdown pre { background: #0f3460; padding: 16px; border-radius: 6px; overflow-x: auto; margin: 12px 0; }
  .markdown strong { color: #53a8b6; }

  /* Welcome state */
  #welcome {
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; height: 100%; color: #444; text-align: center;
  }
  #welcome .emoji { font-size: 64px; margin-bottom: 20px; }
  #welcome p { font-size: 16px; }

  /* Loading */
  #loading {
    display: none; text-align: center; padding: 60px; color: #666;
  }
  .spinner {
    display: inline-block; width: 32px; height: 32px;
    border: 3px solid #0f3460; border-top-color: #e94560;
    border-radius: 50%; animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Responsive */
  @media (max-width: 768px) {
    #sidebar { width: 220px; min-width: 220px; }
    #content-wrapper { padding: 16px; }
  }
</style>
</head>
<body>
  <div id="sidebar">
    <div id="sidebar-header">
      📡 InfoPipeline <span>v0.1</span>
    </div>
    <div id="tree-container">
      <div id="loading-tree" style="padding: 20px; text-align: center; color: #666;">
        <div class="spinner"></div><br>Loading...
      </div>
    </div>
  </div>
  <div id="main">
    <div id="main-header">
      <h1 id="page-title">📡 InfoPipeline</h1>
      <div id="stats"></div>
    </div>
    <div id="content-wrapper">
      <div id="welcome">
        <div class="emoji">📡</div>
        <p>选择左侧日期查看信息报告</p>
      </div>
      <div id="loading">
        <div class="spinner"></div><br>加载中...
      </div>
      <div id="report-content" class="markdown" style="display:none;"></div>
    </div>
  </div>

<script>
const API_BASE = '';  // Same origin, no prefix needed

let treeData = {};
let currentSelection = null;

async function loadTree() {
  try {
    const resp = await fetch(`${API_BASE}/api/tree`);
    treeData = await resp.json();
    renderTree();
  } catch (e) {
    console.error('Failed to load tree:', e);
    document.getElementById('loading-tree').innerHTML = '<p style="color:#e94560">Failed to load</p>';
  }
}

function renderTree() {
  const container = document.getElementById('tree-container');
  container.innerHTML = '';

  const years = Object.keys(treeData).sort().reverse();
  for (const year of years) {
    // Year node: click to expand/collapse
    const yearEl = document.createElement('div');
    yearEl.className = 'tree-year';
    yearEl.innerHTML = `<span class="tree-arrow">▶</span><span class="tree-label">📅 ${year}</span><span class="tree-count">${treeData[year]._count || ''}</span>`;

    // Year children container
    const yearChildren = document.createElement('div');
    yearChildren.className = 'tree-children';

    yearEl.addEventListener('click', () => {
      toggleTreeNode(yearEl, yearChildren);
    });

    const months = Object.keys(treeData[year])
      .filter(k => k !== '_count')
      .sort((a, b) => b.localeCompare(a));

    for (const month of months) {
      const monthData = treeData[year][month];

      // Month node: click to expand/collapse
      const monthEl = document.createElement('div');
      monthEl.className = 'tree-month';
      monthEl.innerHTML = `<span class="tree-arrow">▶</span><span class="tree-label">${month}月</span><span class="tree-count">${monthData._count || ''}</span>`;

      // Month children container
      const monthChildren = document.createElement('div');
      monthChildren.className = 'tree-children';

      monthEl.addEventListener('click', () => {
        toggleTreeNode(monthEl, monthChildren);
        // Auto-open parent year if needed
        if (!yearChildren.classList.contains('open')) {
          toggleTreeNode(yearEl, yearChildren);
        }
      });

      const days = Object.keys(monthData)
        .filter(k => k !== '_count')
        .sort((a, b) => b.localeCompare(a));

      for (const day of days) {
        const dayCount = monthData[day];
        const paddedDay = day.padStart(2, '0');
        const dateStr = `${year}-${month.padStart(2, '0')}-${paddedDay}`;

        const dayEl = document.createElement('div');
        dayEl.className = 'tree-day';
        dayEl.innerHTML = `<span class="tree-label">${paddedDay}日</span><span class="tree-count">${dayCount}</span>`;
        dayEl.dataset.date = dateStr;
        dayEl.addEventListener('click', (e) => {
          e.stopPropagation();
          selectDay(dateStr, dayEl);
        });

        monthChildren.appendChild(dayEl);
      }

      monthEl.appendChild(monthChildren);
      yearChildren.appendChild(monthEl);
    }

    yearEl.appendChild(yearChildren);
    container.appendChild(yearEl);
  }
}

function toggleTreeNode(header, children) {
  const arrow = header.querySelector('.tree-arrow');
  const isOpen = children.classList.contains('open');
  if (isOpen) {
    children.classList.remove('open');
    arrow.classList.remove('expanded');
  } else {
    children.classList.add('open');
    arrow.classList.add('expanded');
  }
}

async function selectDay(dateStr, el) {
  // Update active state
  document.querySelectorAll('.tree-day.active').forEach(e => e.classList.remove('active'));
  el.classList.add('active');
  currentSelection = dateStr;

  // Show loading
  document.getElementById('welcome').style.display = 'none';
  document.getElementById('report-content').style.display = 'none';
  document.getElementById('loading').style.display = 'block';
  document.getElementById('page-title').textContent = `📡 ${dateStr}`;

  try {
    const resp = await fetch(`${API_BASE}/api/report/${dateStr}`);
    const data = await resp.json();

    if (data.content) {
      document.getElementById('loading').style.display = 'none';
      document.getElementById('report-content').style.display = 'block';
      document.getElementById('report-content').innerHTML = renderMarkdown(data.content);
    } else {
      document.getElementById('loading').style.display = 'none';
      document.getElementById('report-content').style.display = 'block';
      document.getElementById('report-content').innerHTML = '<p style="color:#666">该日期暂无报告数据</p>';
    }

    // Update stats
    if (data.stats) {
      document.getElementById('stats').innerHTML =
        `<span>📋 ${data.stats.items || 0} 条信息</span>` +
        `<span>📂 ${data.stats.categories || 0} 个分类</span>`;
    }
  } catch (e) {
    document.getElementById('loading').style.display = 'none';
    document.getElementById('report-content').style.display = 'block';
    document.getElementById('report-content').innerHTML = `<p style="color:#e94560">加载失败: ${e.message}</p>`;
  }
}

// Simple markdown renderer (no dependencies)
function renderMarkdown(md) {
  let html = md;
  // Escape HTML (but preserve intentional HTML in content)
  // We do minimal escaping since this is internal tool
  // Headers
  html = html.replace(/^### (.+)$/gm, '<h3>$1</h3>');
  html = html.replace(/^## (.+)$/gm, '<h2>$1</h2>');
  html = html.replace(/^# (.+)$/gm, '<h1>$1</h1>');
  // Blockquotes
  html = html.replace(/^> (.+)$/gm, '<blockquote>$1</blockquote>');
  // Bold
  html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  // Inline code
  html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
  // Links
  html = html.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank">$1</a>');
  // Unordered lists
  html = html.replace(/^- (.+)$/gm, '<li>$1</li>');
  html = html.replace(/(<li>.*<\/li>)/s, '<ul>$1</ul>');
  // Wrap consecutive <li> in <ul>
  html = html.replace(/<\/ul>\s*<ul>/g, '');
  // Paragraphs
  html = html.replace(/\n\n/g, '</p><p>');
  html = '<p>' + html + '</p>';
  // Clean up empty paragraphs
  html = html.replace(/<p>\s*<(h[1-3]|blockquote|ul|li)/g, '<$1');
  html = html.replace(/<\/(h[1-3]|blockquote|ul)>\s*<\/p>/g, '</$1>');
  html = html.replace(/<p>\s*<\/p>/g, '');
  return html;
}

// Init
loadTree();
</script>
</body>
</html>
